<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TANK BATTLE — 复古坦克大战</title>
<style>
  :root{
    --crt-green: #46ff8a;
    --crt-amber: #ffd166;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background:#050705;
    color:#cdffd4;
    font-family:"Courier New", monospace;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stage{
    position:relative;
    width:min(96vw, calc(96vh * 16 / 9));
    aspect-ratio:16/9;
    border:4px solid #274d2a;
    box-shadow:0 0 0 2px #0a1a0c, 0 0 40px rgba(70,255,138,.15);
    background:#000;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#0a0f0a;
    cursor:crosshair;
  }
  /* CRT scanlines + vignette overlay */
  .scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,.18) 3px,
        rgba(0,0,0,0) 4px
      );
    mix-blend-mode:multiply;
  }
  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%);
  }
  .hint{
    position:absolute;
    left:0; right:0; bottom:-26px;
    text-align:center;
    font-size:11px;
    letter-spacing:2px;
    color:#5f8f68;
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="640" height="360"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="hint">WASD / 方向键移动 · 鼠标瞄准 · 左键 / 空格射击</div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- 画布与缩放 ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;   // 640
  const H = canvas.height;  // 360

  // 逻辑坐标：鼠标 client 坐标 -> 画布坐标
  function toCanvas(e){
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (W / r.width),
      y: (e.clientY - r.top) * (H / r.height)
    };
  }

  // ---------- 调色板 ----------
  const PAL = {
    bg:      "#0a0f0a",
    grid:    "#101a10",
    player:  "#4cd45f",
    player2: "#2f9c42",
    tread:   "#1c2a1c",
    enemy:   "#e2533f",
    enemy2:  "#a8322a",
    plane:   "#c8ccd2",
    plane2:  "#7c838c",
    bullet:  "#ffe14d",
    ebullet: "#ff7a5c",
    brick:   "#b0793f",
    brick2:  "#7a4e24",
    brickL:  "#e0a86a",
    bomb:    "#ffb020",
    boom:    ["#fff6c8","#ffd166","#ff8c42","#e2533f"]
  };

  // ---------- 音效（WebAudio，简单复古音） ----------
  let audioCtx = null;
  function initAudio(){
    if (audioCtx) return;
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  function blip(freq, dur, type, vol, slide){
    if(!audioCtx) return;
    try{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "square";
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }
  const sfx = {
    shoot(){ blip(880, 0.12, "square", 0.10, -520); },
    eShoot(){ blip(220, 0.18, "sawtooth", 0.08, -120); },
    hit(){ blip(160, 0.10, "square", 0.12, -80); },
    boom(){ blip(120, 0.35, "sawtooth", 0.18, -90); },
    die(){ blip(300, 0.6, "sawtooth", 0.2, -240); },
    start(){ blip(660, 0.1, "square", 0.1, 0); blip(990, 0.14, "square", 0.1, 0); }
  };

  // ---------- 输入 ----------
  const keys = {};
  const mouse = { x: W/2, y: H-60, down:false };
  let spaceDown = false;

  addEventListener("keydown", e => {
    initAudio();
    if(e.code === "Space"){ e.preventDefault(); spaceDown = true; }
    keys[e.code] = true;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
    if(state === "menu" && (e.code === "Enter" || e.code === "Space")) startGame();
    else if(state === "over" && e.code === "Enter") startGame();
  });
  addEventListener("keyup", e => {
    if(e.code === "Space") spaceDown = false;
    keys[e.code] = false;
  });
  canvas.addEventListener("mousemove", e => {
    const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y;
  });
  canvas.addEventListener("mousedown", e => {
    initAudio();
    e.preventDefault();
    mouse.down = true;
    if(state === "menu" || state === "over"){ startGame(); }
  });
  addEventListener("mouseup", () => mouse.down = false);
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  // ---------- 游戏状态 ----------
  let state = "menu";     // menu | playing | over
  let score = 0, hi = 0, lives = 3, level = 1;
  let shake = 0, elapsed = 0;

  // 实体数组
  let pBullets = [], eBullets = [], bombs = [], planes = [], ground = [], parts = [];
  let player = null;

  // 砖块（网格）
  const CELL = 16;
  const COLS = Math.ceil(W / CELL);
  const ROWS = Math.ceil(H / CELL);
  let bricks = [];   // 二维 boolean

  function resetBricks(){
    bricks = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    // 中间掩体 + 若干障碍（避开出生点）
    const blocks = [
      [12, 8, 6, 4], [24, 8, 6, 4],      // 上方两块
      [17, 13, 6, 3],                      // 中央
      [8, 15, 5, 3], [28, 15, 5, 3],       // 左右
      [16, 16, 8, 2]                       // 靠下（上移，避开玩家出生点）
    ];
    for(const [cx, cy, w, h] of blocks){
      for(let y=cy; y<cy+h && y<ROWS; y++)
        for(let x=cx; x<cx+w && x<COLS; x++)
          bricks[y][x] = true;
    }
  }
  function brickAt(cx, cy){
    if(cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return false;
    return bricks[cy][cx];
  }
  function killBrick(cx, cy){
    if(cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return false;
    if(bricks[cy][cx]){ bricks[cy][cx] = false; return true; }
    return false;
  }
  // 方盒是否碰到砖
  function boxHitsBrick(x, y, hw, hh){
    const x0 = Math.floor((x - hw) / CELL), x1 = Math.floor((x + hw) / CELL);
    const y0 = Math.floor((y - hh) / CELL), y1 = Math.floor((y + hh) / CELL);
    for(let cy=y0; cy<=y1; cy++)
      for(let cx=x0; cx<=x1; cx++)
        if(brickAt(cx, cy)) return true;
    return false;
  }

  // ---------- 玩家坦克 ----------
  function makePlayer(){
    return {
      x: W/2, y: H-34,
      hw: 15, hh: 14,
      body: -Math.PI/2,   // 朝向
      turret: -Math.PI/2, // 炮管角
      cool: 0, inv: 0
    };
  }

  // ---------- 敌人 ----------
  function spawnPlane(){
    const dir = Math.random() < 0.5 ? 1 : -1;
    planes.push({
      x: dir === 1 ? -30 : W+30,
      y: 26 + Math.random()*74,
      vx: (55 + Math.random()*40) * dir,
      bombCool: 0.6 + Math.random()*1.4,
      hw: 22, hh: 10
    });
  }
  function spawnGround(){
    const fromLeft = Math.random() < 0.5;
    ground.push({
      x: fromLeft ? 18 : W-18,
      y: 24 + Math.random()*40,
      hw: 15, hh: 14,
      body: Math.PI/2,
      turret: Math.PI/2,
      cool: 0.8 + Math.random()*1.2,
      hp: 1
    });
  }

  // ---------- 粒子 ----------
  function burst(x, y, color, n, speed){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const s = speed * (0.3 + Math.random()*0.7);
      parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:0.4+Math.random()*0.5, t:0, color });
    }
  }
  function explode(x, y, big){
    burst(x, y, PAL.boom[1], big?22:12, big?160:110);
    burst(x, y, PAL.boom[2], big?16:8, big?110:80);
    burst(x, y, PAL.boom[0], big?10:5, big?60:40);
    shake = Math.min(14, shake + (big?10:5));
    sfx.boom();
  }

  // ---------- 射击 ----------
  function firePlayer(){
    if(player.cool > 0) return;
    player.cool = 0.22;
    const a = player.turret;
    const mx = player.x + Math.cos(a)*20;
    const my = player.y + Math.sin(a)*20;
    pBullets.push({ x:mx, y:my, vx:Math.cos(a)*340, vy:Math.sin(a)*340, life:1.2 });
    sfx.shoot();
  }

  function enemyShoot(e){
    const a = e.turret;
    const mx = e.x + Math.cos(a)*18;
    const my = e.y + Math.sin(a)*18;
    eBullets.push({ x:mx, y:my, vx:Math.cos(a)*150, vy:Math.sin(a)*150, life:2.4 });
    sfx.eShoot();
  }

  // ---------- 游戏流程 ----------
  function startGame(){
    if(state === "playing") return;
    state = "playing";
    score = 0; lives = 3; level = 1; elapsed = 0; shake = 0;
    pBullets.length = 0; eBullets.length = 0; bombs.length = 0;
    planes.length = 0; ground.length = 0; parts.length = 0;
    resetBricks();
    player = makePlayer();
    sfx.start();
  }

  function gameOver(){
    state = "over";
    hi = Math.max(hi, score);
    sfx.die();
  }

  // ---------- 更新 ----------
  function update(dt){
    elapsed += dt;
    if(shake > 0) shake = Math.max(0, shake - dt*40);

    // 难度随分数提升
    level = 1 + Math.floor(score / 600);

    // 玩家移动（8 方向）
    let dx = 0, dy = 0;
    if(keys["ArrowLeft"] || keys["KeyA"]) dx -= 1;
    if(keys["ArrowRight"] || keys["KeyD"]) dx += 1;
    if(keys["ArrowUp"] || keys["KeyW"]) dy -= 1;
    if(keys["ArrowDown"] || keys["KeyS"]) dy += 1;
    if(dx || dy){
      const len = Math.hypot(dx, dy);
      dx /= len; dy /= len;
      const spd = 118;
      const nx = clamp(player.x + dx*spd*dt, player.hw, W-player.hw);
      const ny = clamp(player.y + dy*spd*dt, player.hh, H-player.hh);
      // 分轴碰撞（砖块阻挡）
      if(!boxHitsBrick(nx, player.y, player.hw, player.hh)) player.x = nx;
      if(!boxHitsBrick(player.x, ny, player.hw, player.hh)) player.y = ny;
      player.body = Math.atan2(dy, dx);
    }
    // 炮管指向鼠标
    player.turret = Math.atan2(mouse.y - player.y, mouse.x - player.x);

    if(player.cool > 0) player.cool -= dt;
    if(player.inv > 0) player.inv -= dt;

    if(mouse.down || spaceDown) firePlayer();

    // 生成
    spawnTimer(dt);

    // 敌机
    for(let i=planes.length-1; i>=0; i--){
      const p = planes[i];
      p.x += p.vx * dt;
      p.bombCool -= dt;
      if(p.bombCool <= 0){
        p.bombCool = 1.4 + Math.random()*1.8;
        bombs.push({ x:p.x, y:p.y+8, vy:75 });
      }
      if(p.x < -60 || p.x > W+60){ planes.splice(i,1); continue; }
    }

    // 地面敌人
    for(let i=ground.length-1; i>=0; i--){
      const e = ground[i];
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      e.body = a;
      e.turret = a;
      const spd = 34 + level*3;
      const nx = e.x + Math.cos(a)*spd*dt;
      const ny = e.y + Math.sin(a)*spd*dt;
      if(!boxHitsBrick(nx, e.y, e.hw, e.hh)) e.x = nx;
      if(!boxHitsBrick(e.x, ny, e.hw, e.hh)) e.y = ny;
      e.cool -= dt;
      if(e.cool <= 0){
        e.cool = 1.6 + Math.random()*1.2 - level*0.08;
        e.cool = Math.max(0.5, e.cool);
        enemyShoot(e);
      }
      // 撞到玩家
      if(rectsOverlap(player, e)){
        hitPlayer();
        ground.splice(i,1);
        explode(e.x, e.y, true);
      }
    }

    // 玩家子弹
    for(let i=pBullets.length-1; i>=0; i--){
      const b = pBullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      let dead = b.life <= 0 || b.x<-10 || b.x>W+10 || b.y<-10 || b.y>H+10;

      if(!dead){
        // 砖块
        const cx = Math.floor(b.x/CELL), cy = Math.floor(b.y/CELL);
        if(brickAt(cx, cy)){ killBrick(cx, cy); burst(b.x, b.y, PAL.brick2, 6, 70); dead = true; sfx.hit(); }
      }
      if(!dead){
        // 敌机
        for(let j=planes.length-1; j>=0; j--){
          if(hitBox(b, planes[j])){
            dead = true;
            score += 50;
            explode(planes[j].x, planes[j].y, false);
            planes.splice(j,1);
            break;
          }
        }
      }
      if(!dead){
        // 地面敌人
        for(let j=ground.length-1; j>=0; j--){
          if(hitBox(b, ground[j])){
            dead = true;
            ground[j].hp -= 1;
            burst(b.x, b.y, PAL.enemy2, 6, 80);
            if(ground[j].hp <= 0){
              score += 100;
              explode(ground[j].x, ground[j].y, true);
              ground.splice(j,1);
            } else {
              // 精英（2 血）闪一下
              ground[j].flash = 0.1;
            }
            break;
          }
        }
      }
      if(dead) pBullets.splice(i,1);
    }

    // 敌方子弹
    for(let i=eBullets.length-1; i>=0; i--){
      const b = eBullets[i];
      b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
      let dead = b.life <= 0 || b.x<-10 || b.x>W+10 || b.y<-10 || b.y>H+10;
      if(!dead){
        const cx = Math.floor(b.x/CELL), cy = Math.floor(b.y/CELL);
        if(brickAt(cx, cy)){ killBrick(cx, cy); burst(b.x,b.y,PAL.brick2,5,60); dead = true; }
      }
      if(!dead && player.inv <= 0 && hitBox(b, player)){
        dead = true;
        hitPlayer();
      }
      if(dead) eBullets.splice(i,1);
    }

    // 炸弹
    for(let i=bombs.length-1; i>=0; i--){
      const b = bombs[i];
      b.y += b.vy*dt;
      let dead = false;
      const cx = Math.floor(b.x/CELL), cy = Math.floor(b.y/CELL);
      if(brickAt(cx, cy)){ killBrick(cx, cy); dead = true; }
      if(b.y >= H-6){ dead = true; }
      if(!dead && player.inv <= 0 && hitBox(b, player)){ hitPlayer(); dead = true; }
      if(dead){ explode(b.x, b.y, false); bombs.splice(i,1); }
    }

    // 粒子
    for(let i=parts.length-1; i>=0; i--){
      const p = parts[i];
      p.t += dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.92; p.vy *= 0.92;
      if(p.t >= p.life) parts.splice(i,1);
    }

    // 地面敌人 flash 衰减
    for(const e of ground) if(e.flash) e.flash -= dt;
  }

  function spawnTimer(dt){
    // 敌机
    if(Math.random() < dt * (0.5 + level*0.12)) spawnPlane();
    // 地面敌人
    if(ground.length < 1 + Math.min(3, level)){
      if(Math.random() < dt * (0.4 + level*0.1)) spawnGround();
    }
  }

  function hitPlayer(){
    if(player.inv > 0) return;
    lives -= 1;
    player.inv = 1.5;
    explode(player.x, player.y, false);
    shake = Math.min(14, shake + 8);
    if(lives <= 0){ gameOver(); }
  }

  // ---------- 碰撞辅助 ----------
  function hitBox(b, o){
    return b.x >= o.x-o.hw && b.x <= o.x+o.hw && b.y >= o.y-o.hh && b.y <= o.y+o.hh;
  }
  function rectsOverlap(a, b){
    return Math.abs(a.x-b.x) < (a.hw+b.hw) && Math.abs(a.y-b.y) < (a.hh+b.hh);
  }
  function clamp(v, lo, hi){ return v<lo?lo:(v>hi?hi:v); }

  // ---------- 渲染 ----------
  function render(){
    ctx.save();
    if(shake > 0){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    // 背景
    ctx.fillStyle = PAL.bg;
    ctx.fillRect(-20,-20, W+40, H+40);
    ctx.fillStyle = PAL.grid;
    for(let y=0; y<H; y+=CELL) for(let x=0; x<W; x+=CELL){
      ctx.fillRect(x+7, y+7, 2, 2);
    }

    // 砖块
    for(let cy=0; cy<ROWS; cy++)
      for(let cx=0; cx<COLS; cx++)
        if(bricks[cy][cx]) drawBrick(cx*CELL, cy*CELL);

    // 炸弹
    for(const b of bombs) drawBomb(b);

    // 敌机
    for(const p of planes) drawPlane(p);

    // 地面敌人
    for(const e of ground) drawTank(e, PAL.enemy, PAL.enemy2, e.flash>0);

    // 玩家
    if(player && state !== "over"){
      const blink = player.inv > 0 && Math.floor(elapsed*12)%2===0;
      if(!blink) drawTank(player, PAL.player, PAL.player2, false);
    }

    // 子弹
    ctx.fillStyle = PAL.bullet;
    for(const b of pBullets){ ctx.fillRect(b.x-2, b.y-2, 4, 4); }
    ctx.fillStyle = PAL.ebullet;
    for(const b of eBullets){ ctx.fillRect(b.x-2, b.y-2, 4, 4); }

    // 粒子
    for(const p of parts){
      ctx.globalAlpha = 1 - p.t/p.life;
      ctx.fillStyle = p.color;
      const s = 3;
      ctx.fillRect(p.x-s/2, p.y-s/2, s, s);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    drawHUD();
    if(state === "menu") drawMenu();
    else if(state === "over") drawOver();
  }

  function drawBrick(x, y){
    ctx.fillStyle = PAL.brick;
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = PAL.brick2;
    ctx.fillRect(x, y+CELL-4, CELL, 4);
    ctx.fillStyle = PAL.brickL;
    ctx.fillRect(x, y, CELL, 2);
    ctx.fillRect(x, y, 2, CELL);
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.fillRect(x+8, y, 2, CELL);
    ctx.fillRect(x, y+8, CELL, 2);
  }

  function drawTank(t, hull, dark, flash){
    ctx.save();
    ctx.translate(t.x, t.y);

    // 履带 + 车身（按朝向旋转）
    ctx.save();
    ctx.rotate(t.body);
    ctx.fillStyle = flash ? "#ffffff" : hull;
    ctx.fillRect(-15, -14, 30, 28);
    // 履带
    ctx.fillStyle = PAL.tread;
    ctx.fillRect(-16, -14, 4, 28);
    ctx.fillRect(12, -14, 4, 28);
    // 细节
    ctx.fillStyle = dark;
    ctx.fillRect(-11, -5, 22, 10);
    ctx.fillStyle = hull;
    ctx.fillRect(-2, -6, 6, 12);
    ctx.restore();

    // 炮塔 + 炮管（指向鼠标 / 玩家）
    ctx.save();
    ctx.rotate(t.turret);
    ctx.fillStyle = dark;
    ctx.fillRect(0, -3, 20, 6);          // 炮管
    ctx.fillStyle = hull;
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = flash ? "#ffffff" : dark;
    ctx.fillRect(-1, -1, 6, 2);          // 炮口
    ctx.restore();

    ctx.restore();
  }

  function drawPlane(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    const dir = p.vx >= 0 ? 1 : -1;
    ctx.scale(dir, 1);
    ctx.fillStyle = PAL.plane;
    ctx.fillRect(-20, -3, 40, 6);        // 机身
    ctx.fillRect(-6, -10, 14, 20);       // 机翼
    ctx.fillRect(12, -2, 8, 4);          // 尾翼
    ctx.fillStyle = PAL.plane2;
    ctx.fillRect(-20, -3, 8, 6);
    ctx.fillRect(-6, 7, 6, 3);           // 下挂
    ctx.fillStyle = "#2a2e33";
    ctx.fillRect(-18, -2, 4, 4);         // 座舱
    ctx.restore();
  }

  function drawBomb(b){
    ctx.fillStyle = PAL.bomb;
    ctx.fillRect(b.x-3, b.y-2, 6, 6);
    ctx.fillStyle = "#5a3a10";
    ctx.fillRect(b.x-2, b.y+3, 4, 3);
  }

  function drawHUD(){
    // 分数 / 生命 / 等级
    ctx.fillStyle = PAL.grid;
    ctx.fillRect(0, 0, W, 20);
    ctx.fillStyle = "#9fffb0";
    ctx.font = "bold 14px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 8, 15);
    ctx.textAlign = "center";
    ctx.fillText("LV " + level, W/2, 15);
    ctx.textAlign = "right";
    ctx.fillText("HI " + hi, W-8, 15);

    // 生命（小坦克图标）
    for(let i=0;i<lives;i++){
      const x = 130 + i*20;
      ctx.fillStyle = PAL.player;
      ctx.fillRect(x-8, 10-5, 16, 10);
      ctx.fillStyle = PAL.player2;
      ctx.fillRect(x-2, 10-3, 8, 6);
    }
  }

  function drawMenu(){
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = "center";
    ctx.fillStyle = PAL.bullet;
    ctx.font = "bold 44px 'Courier New', monospace";
    ctx.fillText("TANK BATTLE", W/2, 140);
    ctx.fillStyle = "#9fffb0";
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText("坦克大战", W/2, 170);
    ctx.fillStyle = "#cfe8d4";
    ctx.font = "14px 'Courier New', monospace";
    ctx.fillText("WASD / 方向键  移动", W/2, 215);
    ctx.fillText("鼠标  瞄准炮口", W/2, 238);
    ctx.fillText("左键 / 空格  射击", W/2, 261);
    ctx.fillText("消灭敌机与地面敌人，避开炸弹！", W/2, 292);
    ctx.fillStyle = PAL.bullet;
    ctx.font = "bold 16px 'Courier New', monospace";
    const blink = Math.floor(elapsed*2)%2===0;
    if(blink) ctx.fillText("- 点击 或 按回车 开始 -", W/2, 330);
  }

  function drawOver(){
    ctx.fillStyle = "rgba(0,0,0,.72)";
    ctx.fillRect(0,0,W,H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff7a5c";
    ctx.font = "bold 40px 'Courier New', monospace";
    ctx.fillText("GAME OVER", W/2, 150);
    ctx.fillStyle = "#9fffb0";
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillText("得分 " + score + "    最高 " + hi, W/2, 195);
    ctx.fillStyle = PAL.bullet;
    ctx.font = "bold 16px 'Courier New', monospace";
    const blink = Math.floor(elapsed*2)%2===0;
    if(blink) ctx.fillText("- 按回车 重新开始 -", W/2, 250);
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  function frame(now){
    let dt = (now - last) / 1000;
    last = now;
    if(dt > 0.05) dt = 0.05;

    if(state === "playing") update(dt);
    else if(state === "menu" || state === "over") elapsed += dt;

    render();
    requestAnimationFrame(frame);
  }

  resetBricks();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
